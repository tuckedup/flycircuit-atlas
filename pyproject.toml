[project]
name = "flycircuit"
version = "0.1.0"
description = "FlyCircuit Atlas: connectome data pipeline, simulator, learning benchmark, causal workbench. Author: Atul Pandey."
authors = [{ name = "Atul Pandey" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=15",
  "duckdb>=1.0",
  "pyyaml>=6",
  "pydantic>=2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "psutil>=5.9",
  "torch>=2.6",
  "mlflow>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
flycircuit = "flycircuit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flycircuit"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: needs cached real data", "gpu: needs CUDA"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/flycircuit/cli.py" = ["E402"]  # thread env vars must be set before numpy/torch import
