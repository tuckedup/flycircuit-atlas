# Offline CPU CI (synthetic fixtures only; no real data, no GPU, no training).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU torch)
        run: |
          uv python install 3.11
          uv venv --python 3.11
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e ".[dev]"
      - run: uv run --no-sync ruff check src tests scripts_release
      - name: Verify published headline numbers against raw rows and documents
        run: uv run --no-sync python scripts_release/verify_w3_headline.py
      - name: Verify complete v6 validation evidence (no models or data)
        run: uv run --no-sync python scripts_release/verify_v6_results.py
      - name: Candidate contract tests (stdlib mocks only)
        run: PYTHONPATH=experiments/v6_candidate uv run --no-sync python -m unittest discover -s experiments/v6_candidate/tests -q
      - name: V6 release corruption checks
        run: uv run --no-sync python -m unittest discover -s scripts_release/tests -q
      - name: Cheap synthetic example
        run: uv run --no-sync flycircuit synthetic run
      - run: uv run --no-sync pytest -q -m "not gpu and not real_data"
