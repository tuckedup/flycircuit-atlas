# Pre-registration for STUDY v3 (learning-v3.0 forgetting endpoint + flygym_nav_v3 body robustness). Owner: Atul Pandey.
# v1 (configs/prereg.yaml) and v2 (configs/prereg_v2.yaml) are historical and untouched.
# Learning stage is frozen with `python -m flycircuit.eval.learning_v3 freeze` AFTER the validation-only search and
# pilot and BEFORE the first test-split evaluation; the freeze tool fills the five fields below.
# Body: training/evaluation manifests in results/provenance/study_v3 archive source, configuration,
# effective settings and timestamps BEFORE the corresponding models/test episodes. File mtimes are not freeze proof.
# The original body YAML retains N=null; power.json supplies the validated, subsequently frozen effective N.
# After freezing change nothing here except by appending to `amendments`.
status: frozen
