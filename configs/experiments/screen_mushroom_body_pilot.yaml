# Model-relative screen on the NAMED PILOT SUBSET mushroom_body_right_pilot (1,500 neurons, right
# hemisphere, seeded proportional subsample; NOT the full mushroom body). Untrained structural model.
source: circuit
sign_policy: legacy_top_nt  # v1 behaviour, pinned so this config still reproduces the v1 screens
circuit: mushroom_body_right_pilot
min_contacts: 5          # model choice, not a universal edge definition
n_sensory: 64            # engineered stimulation sites: seeded KC subset
graph_seed: 0
seed: 0
n_runs: 6
n_interventions: 120
min_distinct_targets: 100
steps: 60
level: neuron
t_start: 10
n_controls: 1
closed_loop: false
unknown_sign: excitatory # sensitivity axis: inhibitory | zero | random_fixed
model: {init_gain: 0.1, tau: 5.0, dt: 1.0, n_out: 2}
